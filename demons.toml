schema_version = 5

[settings]
layout = "grid"
leader = "ctrl-b"
multi_click_ms = 500
logging = false
mcp_access = "full"
mcp_status_bar = true
mcp_scope_id = "c55323fc-83ec-4807-8fd8-5e2dbacf5418"
watch_mode = "auto"
watch_poll_interval = "1s"

[[task]]
name = "backend"
command = ["cargo", "run", "-p", "vashti"]
cwd = "./apps/vashti"
depends_on = []
watch = [
    "Cargo.toml",
    "Cargo.lock",
    "apps/vashti/src",
    "apps/vashti/Cargo.toml",
    "apps/vashti/build.rs",
    "apps/vashti/migrations",
]
watch_delay = "400ms"

[task.env]
RUST_BACKTRACE = "1"

[[task]]
name = "web"
command = ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
cwd = "./apps/vashti/web"
depends_on = []

[task.env]

[[terminal]]
name = "shell"
cwd = "."

[terminal.env]
