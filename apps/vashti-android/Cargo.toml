[package]
name = "vashti-android"
version = "0.10.1"
edition = "2024"

[lib]
name = "vashti_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vashti-android"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "sync"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
tauri = { version = "2.11.5", default-features = false, features = ["compression", "wry"] }
