[package]
name = "kuno-text-lab"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ornith-resident-lab"
path = "src/ornith_main.rs"

[[bin]]
name = "flash-kernel-lab"
path = "src/flash_fast_main.rs"

[[bin]]
name = "kuno-text-lab"
path = "src/main.rs"

[[bin]]
name = "kuno-strata-rust"
path = "src/main.rs"
required-features = ["strata-rust-port"]

[dependencies]
ash = "=0.38.0"
cubecl-common = "=0.10.0"
cubecl-runtime = "=0.10.0"
serde_json = "1"
zeroize = "1.9"
half = "=2.7.1"
kuno-text = { path = "../../../../crates/kuno-text" }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "wgpu"] }
wgpu = { version = "29", default-features = false, features = ["std", "vulkan", "wgsl"] }

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
cubecl-common = { path = "vendor/cubecl-common" }
cubecl-runtime = { path = "vendor/cubecl-runtime" }
cubecl-core = { path = "vendor/cubecl-core" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }

[features]
# Compiled experiment; every invocation must explicitly select it in the runner.
direct-device = ["cubecl-common/kuno-direct-device"]
# Whole-model Strata precision/scheduling port; isolated from installed Kuno.
strata-rust-port = ["direct-device"]
strata-eight-window = ["strata-rust-port"]
strata-resident-224 = ["strata-rust-port"]
strata-resident-240 = ["strata-resident-224"]
strata-intel-core = ["strata-resident-240"]
# Separate arithmetic candidate: original weights, explicit FMA/32-lane CPU.
cpu-fma = []
cpu-buffered-weights = []
cpu-work-stealing = ["kuno-text/cpu-work-stealing-lab"]
cpu-q8-two-pass = ["kuno-text/cpu-q8-two-pass"]

[profile.release]
debug = 0

# Operator laboratory stays out of deployed Kuno dependency/release builds.
[workspace]
