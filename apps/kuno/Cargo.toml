[package]
name = "kuno"
version = "0.1.0"
edition = "2024"

[features]
# The image engine is Rust (`rust-image`). The older C++ engine (`native-image`) is exclusive
# with it: build that with `--no-default-features --features native-image`.
default = ["rust-image"]
native-image = ["kuno-image/native-sd"]
rust-dit = ["kuno-image/rust-dit"]
# The private image worker with every model in Rust (no C++ engine): the managed runtime's.
rust-image = ["kuno-image/rust-image"]

[dependencies]
kuno-image = { path = "../../crates/kuno-image" }
axum = "0.8"
bytes = "1"
base64 = "0.22"
futures-util = "0.3"
http-body = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
kuno-protocol = { path = "../../crates/kuno-protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sha2 = "0.10"
rayon = "1"
zeroize = "1.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"
