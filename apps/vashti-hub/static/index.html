<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vashti</title>
    <meta name="description" content="A lightweight self-hosted chat UI for Ollama.">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">Vashti</a>
      </header>

      <section>
        <h1>Run your own local-first chat UI.</h1>
        <p class="lede">
          Vashti is a lightweight self-hosted chat UI for one or more Ollama backends. Install one
          Rust binary with embedded frontend assets, no Docker stack or Python environment to manage.
        </p>
        <div class="command">
          <code id="install-command">curl -fsSL https://vashti.chat/install.sh | sh</code>
          <button type="button" id="copy-install">Copy</button>
        </div>
      </section>

      <footer class="footer">
        <a href="https://github.com/jmicko/vashti">GitHub</a>
        <a href="/admin">Admin</a>
      </footer>
    </main>
    <script>
      const copyButton = document.getElementById("copy-install");
      const installCommand = document.getElementById("install-command");

      copyButton?.addEventListener("click", async () => {
        const text = installCommand?.textContent?.trim() ?? "";
        if (!text) return;

        if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.append(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }

        copyButton.textContent = "Copied";
        setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1800);
      });
    </script>
  </body>
</html>
