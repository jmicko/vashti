<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vashti Releases</title>
    <meta name="description" content="Vashti release history and notes.">
    <link rel="canonical" href="https://vashti.chat/releases">
    <meta property="og:title" content="Vashti Releases">
    <meta property="og:description" content="Release history, notes, and install commands for Vashti.">
    <meta property="og:url" content="https://vashti.chat/releases">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://vashti.chat/favicon.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Vashti home">
          <img class="brand-image" src="/logo.png" alt="Vashti">
        </a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/getting-started">Getting Started</a>
          <a href="/releases">Releases</a>
        </nav>
      </header>

      <section>
        <p class="eyebrow">Release History</p>
        <h1>What changed.</h1>
        <div id="release-list" class="release-list public-release-list">
          <p class="muted">Loading releases...</p>
        </div>
      </section>

      <footer class="footer">
        <a href="https://github.com/jmicko/vashti">GitHub</a>
        <a href="/admin">Admin</a>
      </footer>
    </main>
    <script>
      const releaseList = document.querySelector("#release-list");

      function formatBytes(value) {
        const units = ["B", "KiB", "MiB", "GiB"];
        let size = Number(value);
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) {
          size /= 1024;
          unit += 1;
        }
        return `${size.toFixed(unit === 0 ? 0 : 2)} ${units[unit]}`;
      }

      function formatDate(timestamp) {
        return new Date(timestamp * 1000).toLocaleDateString();
      }

      function releaseSize(release) {
        return release.artifacts.reduce(
          (total, artifact) => total + Number(artifact.size_bytes || 0),
          0
        );
      }

      function installCommandFor(release) {
        if (release.is_latest) {
          return "curl -fsSL https://vashti.chat/install.sh | sh";
        }
        return `curl -fsSL https://vashti.chat/install.sh | VASHTI_VERSION=${release.version} sh`;
      }

      function renderReleases(releases) {
        releaseList.textContent = "";
        if (releases.length === 0) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "No releases have been uploaded yet.";
          releaseList.append(empty);
          return;
        }

        for (const release of releases) {
          const card = document.createElement("article");
          card.className = "release-card";

          const header = document.createElement("div");
          header.className = "release-card-header";

          const title = document.createElement("div");
          const heading = document.createElement("h2");
          heading.textContent = release.version;
          const badges = document.createElement("p");
          badges.className = "release-badges";
          if (release.is_prerelease) {
            const badge = document.createElement("span");
            badge.textContent = "Prerelease";
            badges.append(badge);
          }
          if (release.is_latest) {
            const badge = document.createElement("span");
            badge.textContent = "Latest";
            badges.append(badge);
          }
          const meta = document.createElement("p");
          meta.className = "muted";
          meta.textContent = `Released ${formatDate(release.created_at)} · ${formatBytes(releaseSize(release))}`;
          title.append(heading, badges, meta);
          header.append(title);
          card.append(header);

          const notes = document.createElement("pre");
          notes.className = "release-notes";
          notes.textContent = release.notes || "No release notes were provided.";
          card.append(notes);

          const artifacts = document.createElement("div");
          artifacts.className = "release-artifacts";
          for (const artifact of release.artifacts) {
            const link = document.createElement("a");
            link.href = artifact.download_url;
            link.textContent = `${artifact.target} · ${formatBytes(artifact.size_bytes)}`;
            artifacts.append(link);
          }
          card.append(artifacts);

          const command = document.createElement("div");
          command.className = "command compact";
          const code = document.createElement("code");
          code.textContent = installCommandFor(release);
          const copy = document.createElement("button");
          copy.type = "button";
          copy.textContent = "Copy";
          copy.addEventListener("click", async () => {
            const text = code.textContent || "";
            if (navigator.clipboard) {
              await navigator.clipboard.writeText(text);
            } else {
              const textarea = document.createElement("textarea");
              textarea.value = text;
              document.body.append(textarea);
              textarea.select();
              document.execCommand("copy");
              textarea.remove();
            }
            copy.textContent = "Copied";
            setTimeout(() => {
              copy.textContent = "Copy";
            }, 1800);
          });
          command.append(code, copy);
          card.append(command);

          releaseList.append(card);
        }
      }

      fetch("/api/releases")
        .then((response) => {
          if (!response.ok) throw new Error("Failed to load releases");
          return response.json();
        })
        .then(renderReleases)
        .catch((error) => {
          releaseList.innerHTML = "";
          const message = document.createElement("p");
          message.className = "danger";
          message.textContent = error.message;
          releaseList.append(message);
        });
    </script>
  </body>
</html>
